# Render Blueprint: one web service. Neon PostgreSQL is the persistent database.
# Configure NEON_DATABASE_URL in the Render dashboard; do not provision ephemeral storage.
services:
  - type: web
    name: nse-upstox-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install --disable-pip-version-check --prefer-binary -r requirements.txt
    startCommand: gunicorn app.web:app --worker-class uvicorn_worker.UvicornWorker --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Kolkata
      - key: NEON_DATABASE_URL
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: KEEPALIVE
        value: "1"
      - key: REQUIRE_PERSISTENT_DB
        value: "1"
