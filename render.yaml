# Render Blueprint: one free web service + one free Postgres.
# New > Blueprint > pick your repo. Then fill the secrets marked sync:false in the dashboard.
services:
  - type: web
    name: nse-upstox-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker only: the scheduler runs inside the process.
    startCommand: gunicorn app.web:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: signal-bot-db
          property: connectionString
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: KEEPALIVE
        value: "1"

databases:
  - name: signal-bot-db
    plan: free
    databaseName: signals
